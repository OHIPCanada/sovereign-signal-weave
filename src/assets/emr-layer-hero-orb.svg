<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 512) rotate(90) scale(170)">
      <stop offset="0" stop-color="#E6FBFF"/>
      <stop offset="0.28" stop-color="#5CD4FF"/>
      <stop offset="0.62" stop-color="#2384E8"/>
      <stop offset="1" stop-color="#0D4FA1"/>
    </radialGradient>
    <radialGradient id="shellGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 512) rotate(90) scale(260)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#62B8FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1F6EC8" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="soft" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="strongGlow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Layered horizontal data bands — representing record strata -->
  <g stroke="#56A8FF" stroke-opacity="0.35" stroke-width="2" filter="url(#soft)">
    <line x1="310" y1="340" x2="714" y2="340"/>
    <line x1="280" y1="420" x2="744" y2="420"/>
    <line x1="280" y1="512" x2="744" y2="512"/>
    <line x1="280" y1="604" x2="744" y2="604"/>
    <line x1="310" y1="684" x2="714" y2="684"/>
  </g>

  <!-- Vertical connectors between layers -->
  <g stroke="#56A8FF" stroke-opacity="0.22" stroke-width="1.5" filter="url(#soft)">
    <line x1="380" y1="340" x2="350" y2="420"/>
    <line x1="512" y1="340" x2="512" y2="420"/>
    <line x1="644" y1="340" x2="674" y2="420"/>
    <line x1="350" y1="420" x2="330" y2="512"/>
    <line x1="512" y1="420" x2="512" y2="512"/>
    <line x1="674" y1="420" x2="694" y2="512"/>
    <line x1="330" y1="512" x2="350" y2="604"/>
    <line x1="512" y1="512" x2="512" y2="604"/>
    <line x1="694" y1="512" x2="674" y2="604"/>
    <line x1="350" y1="604" x2="380" y2="684"/>
    <line x1="512" y1="604" x2="512" y2="684"/>
    <line x1="674" y1="604" x2="644" y2="684"/>
  </g>

  <!-- Cross-layer diagonal links -->
  <g stroke="#7AC4FF" stroke-opacity="0.18" stroke-width="1.2" filter="url(#soft)">
    <line x1="380" y1="340" x2="512" y2="420"/>
    <line x1="644" y1="340" x2="512" y2="420"/>
    <line x1="350" y1="420" x2="512" y2="512"/>
    <line x1="674" y1="420" x2="512" y2="512"/>
    <line x1="330" y1="512" x2="512" y2="604"/>
    <line x1="694" y1="512" x2="512" y2="604"/>
    <line x1="430" y1="420" x2="600" y2="604"/>
    <line x1="600" y1="420" x2="430" y2="604"/>
  </g>

  <!-- Radial spokes from center -->
  <g stroke="#56A8FF" stroke-opacity="0.4" stroke-width="2.8" filter="url(#soft)">
    <line x1="512" y1="512" x2="330" y2="512"/>
    <line x1="512" y1="512" x2="694" y2="512"/>
    <line x1="512" y1="512" x2="512" y2="340"/>
    <line x1="512" y1="512" x2="512" y2="684"/>
    <line x1="512" y1="512" x2="380" y2="340"/>
    <line x1="512" y1="512" x2="644" y2="340"/>
    <line x1="512" y1="512" x2="380" y2="684"/>
    <line x1="512" y1="512" x2="644" y2="684"/>
  </g>

  <circle cx="512" cy="512" r="155" fill="url(#shellGlow)"/>
  <circle cx="512" cy="512" r="110" fill="url(#coreGlow)"/>
  <circle cx="512" cy="512" r="38" fill="#E6FBFF" filter="url(#strongGlow)"/>

  <!-- Layer nodes -->
  <g>
    <circle cx="310" cy="340" r="8" fill="#5DA8FF"/>
    <circle cx="380" cy="340" r="10" fill="#6BB8FF"/>
    <circle cx="512" cy="340" r="12" fill="#78C8FF"/>
    <circle cx="644" cy="340" r="10" fill="#6BB8FF"/>
    <circle cx="714" cy="340" r="8" fill="#5DA8FF"/>

    <circle cx="280" cy="420" r="8" fill="#5DA8FF"/>
    <circle cx="350" cy="420" r="10" fill="#6BB8FF"/>
    <circle cx="430" cy="420" r="9" fill="#8BD4FF"/>
    <circle cx="512" cy="420" r="11" fill="#78C8FF"/>
    <circle cx="600" cy="420" r="9" fill="#8BD4FF"/>
    <circle cx="674" cy="420" r="10" fill="#6BB8FF"/>
    <circle cx="744" cy="420" r="8" fill="#5DA8FF"/>

    <circle cx="280" cy="512" r="9" fill="#5DA8FF"/>
    <circle cx="330" cy="512" r="11" fill="#6BB8FF"/>
    <circle cx="694" cy="512" r="11" fill="#6BB8FF"/>
    <circle cx="744" cy="512" r="9" fill="#5DA8FF"/>

    <circle cx="280" cy="604" r="8" fill="#5DA8FF"/>
    <circle cx="350" cy="604" r="10" fill="#6BB8FF"/>
    <circle cx="430" cy="604" r="9" fill="#8BD4FF"/>
    <circle cx="512" cy="604" r="11" fill="#78C8FF"/>
    <circle cx="600" cy="604" r="9" fill="#8BD4FF"/>
    <circle cx="674" cy="604" r="10" fill="#6BB8FF"/>
    <circle cx="744" cy="604" r="8" fill="#5DA8FF"/>

    <circle cx="310" cy="684" r="8" fill="#5DA8FF"/>
    <circle cx="380" cy="684" r="10" fill="#6BB8FF"/>
    <circle cx="512" cy="684" r="12" fill="#78C8FF"/>
    <circle cx="644" cy="684" r="10" fill="#6BB8FF"/>
    <circle cx="714" cy="684" r="8" fill="#5DA8FF"/>
  </g>
</svg>