<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 512) rotate(90) scale(160)">
      <stop offset="0" stop-color="#E6FFF2"/>
      <stop offset="0.28" stop-color="#5CFFA8"/>
      <stop offset="0.62" stop-color="#23B878"/>
      <stop offset="1" stop-color="#0D6A4A"/>
    </radialGradient>
    <radialGradient id="shellGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 512) rotate(90) scale(250)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#62FFAA" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1FB870" stop-opacity="0.4"/>
    </radialGradient>
    <filter id="soft" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="strongGlow" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Concentric hexagonal rings — representing access layers -->
  <!-- Outer hexagon -->
  <g stroke="#56C88A" stroke-opacity="0.3" stroke-width="2.2" filter="url(#soft)">
    <line x1="512" y1="262" x2="728" y2="387"/>
    <line x1="728" y1="387" x2="728" y2="637"/>
    <line x1="728" y1="637" x2="512" y2="762"/>
    <line x1="512" y1="762" x2="296" y2="637"/>
    <line x1="296" y1="637" x2="296" y2="387"/>
    <line x1="296" y1="387" x2="512" y2="262"/>
  </g>

  <!-- Middle hexagon -->
  <g stroke="#5DD898" stroke-opacity="0.4" stroke-width="2.5" filter="url(#soft)">
    <line x1="512" y1="342" x2="660" y2="428"/>
    <line x1="660" y1="428" x2="660" y2="596"/>
    <line x1="660" y1="596" x2="512" y2="682"/>
    <line x1="512" y1="682" x2="364" y2="596"/>
    <line x1="364" y1="596" x2="364" y2="428"/>
    <line x1="364" y1="428" x2="512" y2="342"/>
  </g>

  <!-- Inner hexagon -->
  <g stroke="#6BE8A0" stroke-opacity="0.5" stroke-width="2" filter="url(#soft)">
    <line x1="512" y1="420" x2="592" y2="466"/>
    <line x1="592" y1="466" x2="592" y2="558"/>
    <line x1="592" y1="558" x2="512" y2="604"/>
    <line x1="512" y1="604" x2="432" y2="558"/>
    <line x1="432" y1="558" x2="432" y2="466"/>
    <line x1="432" y1="466" x2="512" y2="420"/>
  </g>

  <!-- Spokes from center to outer hexagon vertices -->
  <g stroke="#56C88A" stroke-opacity="0.45" stroke-width="2.8" filter="url(#soft)">
    <line x1="512" y1="512" x2="512" y2="262"/>
    <line x1="512" y1="512" x2="728" y2="387"/>
    <line x1="512" y1="512" x2="728" y2="637"/>
    <line x1="512" y1="512" x2="512" y2="762"/>
    <line x1="512" y1="512" x2="296" y2="637"/>
    <line x1="512" y1="512" x2="296" y2="387"/>
  </g>

  <!-- Cross connections between hex layers -->
  <g stroke="#7AFFB8" stroke-opacity="0.18" stroke-width="1.2" filter="url(#soft)">
    <line x1="512" y1="262" x2="660" y2="428"/>
    <line x1="728" y1="387" x2="660" y2="596"/>
    <line x1="728" y1="637" x2="512" y2="682"/>
    <line x1="512" y1="762" x2="364" y2="596"/>
    <line x1="296" y1="637" x2="364" y2="428"/>
    <line x1="296" y1="387" x2="512" y2="342"/>
    <line x1="512" y1="342" x2="592" y2="466"/>
    <line x1="660" y1="428" x2="592" y2="558"/>
    <line x1="660" y1="596" x2="512" y2="604"/>
    <line x1="512" y1="682" x2="432" y2="558"/>
    <line x1="364" y1="596" x2="432" y2="466"/>
    <line x1="364" y1="428" x2="512" y2="420"/>
  </g>

  <circle cx="512" cy="512" r="148" fill="url(#shellGlow)"/>
  <circle cx="512" cy="512" r="105" fill="url(#coreGlow)"/>
  <circle cx="512" cy="512" r="36" fill="#E6FFF2" filter="url(#strongGlow)"/>

  <!-- Outer hex nodes -->
  <g>
    <circle cx="512" cy="262" r="14" fill="#5DD898"/>
    <circle cx="728" cy="387" r="13" fill="#6BE8A0"/>
    <circle cx="728" cy="637" r="13" fill="#56C88A"/>
    <circle cx="512" cy="762" r="14" fill="#5DD898"/>
    <circle cx="296" cy="637" r="13" fill="#56C88A"/>
    <circle cx="296" cy="387" r="13" fill="#6BE8A0"/>
  </g>

  <!-- Mid hex nodes -->
  <g>
    <circle cx="512" cy="342" r="11" fill="#78F0B0"/>
    <circle cx="660" cy="428" r="10" fill="#6BE8A0"/>
    <circle cx="660" cy="596" r="10" fill="#5DD898"/>
    <circle cx="512" cy="682" r="11" fill="#78F0B0"/>
    <circle cx="364" cy="596" r="10" fill="#5DD898"/>
    <circle cx="364" cy="428" r="10" fill="#6BE8A0"/>
  </g>

  <!-- Inner hex nodes -->
  <g>
    <circle cx="512" cy="420" r="8" fill="#8BFFBA"/>
    <circle cx="592" cy="466" r="7" fill="#78F0B0"/>
    <circle cx="592" cy="558" r="7" fill="#78F0B0"/>
    <circle cx="512" cy="604" r="8" fill="#8BFFBA"/>
    <circle cx="432" cy="558" r="7" fill="#78F0B0"/>
    <circle cx="432" cy="466" r="7" fill="#78F0B0"/>
  </g>
</svg>